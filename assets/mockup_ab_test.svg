<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#151513" rx="8"/>
  <text x="400" y="50" fill="#fff" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">A/B TESTING: LỌC KHÁCH TỪ CONTENT</text>
  
  <!-- Ad A -->
  <rect x="50" y="90" width="320" height="260" fill="#25241f" rx="8" stroke="#333" stroke-width="1"/>
  <text x="210" y="130" fill="#696861" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MẪU CŨ (CONTENT CHUNG CHUNG)</text>
  <line x1="70" y1="150" x2="350" y2="150" stroke="#333" stroke-width="1"/>
  <text x="70" y="190" fill="#fff" font-family="monospace" font-size="16">Tin nhắn thu về:</text>
  <text x="350" y="190" fill="#fff" font-family="monospace" font-size="16" text-anchor="end">100</text>
  <text x="70" y="230" fill="#fff" font-family="monospace" font-size="16">Đơn hàng chốt:</text>
  <text x="350" y="230" fill="#fff" font-family="monospace" font-size="16" text-anchor="end">10</text>
  <rect x="70" y="260" width="280" height="60" fill="#3a1c1a" rx="4"/>
  <text x="210" y="296" fill="#e4472f" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">Tỷ lệ chốt: 10.0%</text>

  <!-- Ad B -->
  <rect x="430" y="90" width="320" height="260" fill="#25241f" rx="8" stroke="#e4472f" stroke-width="2"/>
  <text x="590" y="130" fill="#e4472f" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MẪU MỚI (NÊU RÕ GIÁ &amp; ĐIỀU KIỆN)</text>
  <line x1="450" y1="150" x2="730" y2="150" stroke="#333" stroke-width="1"/>
  <text x="450" y="190" fill="#fff" font-family="monospace" font-size="16">Tin nhắn thu về:</text>
  <text x="730" y="190" fill="#fff" font-family="monospace" font-size="16" text-anchor="end">40</text>
  <text x="450" y="230" fill="#fff" font-family="monospace" font-size="16">Đơn hàng chốt:</text>
  <text x="730" y="230" fill="#fff" font-family="monospace" font-size="16" text-anchor="end">15</text>
  <rect x="450" y="260" width="280" height="60" fill="#1d3022" rx="4"/>
  <text x="590" y="296" fill="#4caf50" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">Tỷ lệ chốt: 37.5%</text>

  <!-- Watermark -->
  <g opacity="0.06" transform="translate(400.0, 200.0) rotate(-20)">
    <text x="0" y="0" fill="#888" font-family="sans-serif" font-weight="900" font-size="80" text-anchor="middle" letter-spacing="8">PHẠM PHONG</text>
  </g>
  <g opacity="0.4">
    <text x="776" y="376" fill="#888" font-family="monospace" font-weight="600" font-size="14" text-anchor="end">© Phạm Phong</text>
  </g>
</svg>