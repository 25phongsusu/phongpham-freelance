<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#151513" rx="8"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#333"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)" rx="8"/>

  <!-- Connection Lines -->
  <path d="M 180 200 C 240 200, 260 200, 320 200" fill="none" stroke="#e4472f" stroke-width="4" stroke-dasharray="8 4"/>
  <path d="M 480 200 C 540 200, 540 120, 600 120" fill="none" stroke="#4caf50" stroke-width="4"/>
  <path d="M 480 200 C 540 200, 540 280, 600 280" fill="none" stroke="#2196f3" stroke-width="4"/>

  <!-- Node 1: Webhook -->
  <rect x="40" y="160" width="140" height="80" fill="#1a1a17" rx="8" stroke="#e4472f" stroke-width="2"/>
  <text x="110" y="195" fill="#fff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">FB Lead Ads</text>
  <text x="110" y="215" fill="#a9a79f" font-family="sans-serif" font-size="12" text-anchor="middle">Bắt sự kiện</text>

  <!-- Node 2: Router/Processing -->
  <rect x="320" y="160" width="160" height="80" fill="#1a1a17" rx="8" stroke="#ffeb3b" stroke-width="2"/>
  <text x="400" y="195" fill="#fff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Xử lý Dữ liệu</text>
  <text x="400" y="215" fill="#a9a79f" font-family="sans-serif" font-size="12" text-anchor="middle">Định dạng &amp; Lọc</text>

  <!-- Node 3: Google Sheets -->
  <rect x="600" y="80" width="160" height="80" fill="#1a1a17" rx="8" stroke="#4caf50" stroke-width="2"/>
  <text x="680" y="115" fill="#fff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Google Sheets</text>
  <text x="680" y="135" fill="#a9a79f" font-family="sans-serif" font-size="12" text-anchor="middle">Cập nhật File</text>

  <!-- Node 4: Zalo ZNS -->
  <rect x="600" y="240" width="160" height="80" fill="#1a1a17" rx="8" stroke="#2196f3" stroke-width="2"/>
  <text x="680" y="275" fill="#fff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Zalo API</text>
  <text x="680" y="295" fill="#a9a79f" font-family="sans-serif" font-size="12" text-anchor="middle">Gửi tin Tự động</text>

  <!-- Overlay UI -->
  <rect x="20" y="20" width="180" height="40" fill="#25241f" rx="20"/>
  <circle cx="40" cy="40" r="10" fill="#4caf50"/>
  <text x="60" y="45" fill="#fff" font-family="sans-serif" font-size="14">Workflow: Đang chạy</text>

  <!-- Watermark -->
  <g opacity="0.06" transform="translate(400.0, 200.0) rotate(-20)">
    <text x="0" y="0" fill="#888" font-family="sans-serif" font-weight="900" font-size="80" text-anchor="middle" letter-spacing="8">PHẠM PHONG</text>
  </g>
  <g opacity="0.4">
    <text x="776" y="376" fill="#888" font-family="monospace" font-weight="600" font-size="14" text-anchor="end">© Phạm Phong</text>
  </g>
</svg>
